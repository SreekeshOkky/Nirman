services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_BRAND_NAME: ${VITE_BRAND_NAME:-}
        VITE_BRAND_LOGO: ${VITE_BRAND_LOGO:-}
        VITE_THEME_ACCENT: ${VITE_THEME_ACCENT:-}
    ports:
      - "8080:80"
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      # The local Supabase stack runs on the host; the browser reaches it at
      # 127.0.0.1:54321, but this container reaches the host via the gateway.
      SUPABASE_URL: http://host.docker.internal:54321
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      FEATURE_FLAGS: ${FEATURE_FLAGS:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
